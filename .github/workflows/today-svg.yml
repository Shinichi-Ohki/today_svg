# today_svg リポジトリの定時生成ワークフロー。
# 毎日 JST 0:00（UTC 15:00）に today.svg を生成してコミットする。
name: today-svg

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node gen_today_svg.mjs .
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add today.svg
          git diff --cached --quiet || git commit -m "today.svg: $(TZ=Asia/Tokyo date +%F)"
          git push
