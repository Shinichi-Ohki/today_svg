# today_svg リポジトリの定時生成ワークフロー。
# 毎時起動し、その日（JST）の画像が古ければ生成して push する。
# 0:00 ちょうどの切り替えにはこだわらず、日付が変わって最初に起動した回で更新する
# （GitHub の定時実行は遅延・欠落が多いので、たいてい 0〜5時のどこかで切り替わる）。
name: today-svg

on:
  schedule:
    - cron: '7 * * * *'  # 毎時7分（毎時0分の混雑を避ける）
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: today-svg
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node gen_today_svg.mjs .
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add today.svg
          git diff --cached --quiet && exit 0
          git commit -m "today.svg: $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase
          git push
      # Pages のデプロイは GitHub 側の 502 などで失敗することがあり、失敗すると
      # 次のコミット（翌日）まで公開版が古いまま残る。公開版とリポジトリを比べ、
      # 違っていれば Pages の再ビルドを依頼する。push 直後の回はデプロイ完了を最大5分待つ。
      # ここで直らなくても、次の毎時実行で再び確認する。
      - name: Ensure Pages is up to date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/today.svg"
          for i in $(seq 1 10); do
            curl -fsS "$url?t=$(date +%s)" | cmp -s - today.svg && { echo "公開版は最新"; exit 0; }
            sleep 30
          done
          echo "公開版が古いので Pages の再ビルドを依頼する"
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
