# today_svg リポジトリの定時生成ワークフロー。
# GitHub の定時実行は遅延・欠落が多いので毎時起動する。
# JST 19時以降に起動した回は翌日分を先に生成し、JST 0:00 まで待ってから push する（1ジョブ最長6時間に収まる）。
# それ以外の回はその日の画像が最新か確認し、古ければ更新する（取りこぼしの保険）。
# 待機中の回がある間、後続の回は concurrency で順番待ちになり、変更なしで終わる。
name: today-svg

on:
  schedule:
    - cron: '7 * * * *'  # 毎時7分（毎時0分の混雑を避ける）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today-svg
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate
        run: |
          # JST 19時以降の起動なら翌日分を作って 0:00 まで待つ（手動実行は常にその日の分）。それ以外はその日の分
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(TZ=Asia/Tokyo date +%-H)" -ge 19 ]; then
            target=$(TZ=Asia/Tokyo date -d tomorrow +%F)
            wait=$(( $(TZ=Asia/Tokyo date -d "$target 00:00:00" +%s) - $(date +%s) ))
          else
            target=$(TZ=Asia/Tokyo date +%F)
            wait=0
          fi
          node gen_today_svg.mjs . --date="$target"
          echo "TARGET=$target" >> "$GITHUB_ENV"
          echo "WAIT=$wait" >> "$GITHUB_ENV"
      - name: Wait until JST 0:00
        if: env.WAIT != '0'
        run: sleep "$WAIT"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add today.svg
          git diff --cached --quiet && exit 0
          git commit -m "today.svg: $TARGET"
          git pull --rebase
          git push
