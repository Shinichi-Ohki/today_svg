# today_svg リポジトリの定時生成ワークフロー。
# 定時実行は遅れがちなので、JST 23:30 に起動して翌日分を先に生成し、JST 0:00 まで待ってから push する。
# JST 0:10 の実行は保険（その日の画像が既にあれば何もしない）。手動実行はその日の分をすぐ生成する。
name: today-svg

on:
  schedule:
    - cron: '30 14 * * *'  # JST 23:30
    - cron: '10 15 * * *'  # JST 0:10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today-svg
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate
        run: |
          # JST 23時台の起動なら翌日分を作って 0:00 まで待つ。それ以外はその日の分
          if [ "$(TZ=Asia/Tokyo date +%H)" = 23 ]; then
            target=$(TZ=Asia/Tokyo date -d tomorrow +%F)
            wait=$(( $(TZ=Asia/Tokyo date -d "$target 00:00:00" +%s) - $(date +%s) ))
          else
            target=$(TZ=Asia/Tokyo date +%F)
            wait=0
          fi
          node gen_today_svg.mjs . --date="$target"
          echo "TARGET=$target" >> "$GITHUB_ENV"
          echo "WAIT=$wait" >> "$GITHUB_ENV"
      - name: Wait until JST 0:00
        if: env.WAIT != '0'
        run: sleep "$WAIT"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add today.svg
          git diff --cached --quiet && exit 0
          git commit -m "today.svg: $TARGET"
          git pull --rebase
          git push
